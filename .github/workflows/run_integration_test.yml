name: run-integration-test
permissions:
  contents: read

on:
  pull_request:

jobs:
  run-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gnoswap repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build gno toolchain
        run: scripts/gno.sh setup

      - name: Run integration tests
        run: scripts/gno.sh integration --all --skip
