name: run-test

on:
  pull_request:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4

      - name: Install bundler
        run: gem install bundler

      - name: Install ruby gems
        run: bundle install

      - name: Generate test matrix
        id: set-matrix
        run: |
          chmod +x .github/scripts/generate_matrix.rb
          echo "matrix=$(ruby .github/scripts/generate_matrix.rb contract tests/scenario)" >> $GITHUB_OUTPUT

  setup-gno:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.ref.outputs.key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve gno master commit
        id: ref
        shell: bash
        run: |
          sha="$(git ls-remote https://github.com/gnoswap-labs/gno.git refs/heads/master | cut -f1)"
          test -n "$sha"
          echo "key=gno-toolchain-$sha" >> "$GITHUB_OUTPUT"

      - name: Restore gno toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/gno-toolchains
          key: ${{ steps.ref.outputs.key }}

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build gno toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/gno.sh setup

  test-gnoswap:
    needs: [generate-matrix, setup-gno]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.generate-matrix.outputs.matrix)}}

    steps:
      - name: Check out gnoswap repo
        uses: actions/checkout@v4

      - name: Restore gno toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/gno-toolchains
          key: ${{ needs.setup-gno.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Update fuzz test seed
        run: |
          chmod +x .github/scripts/update_fuzz_seed.sh
          .github/scripts/update_fuzz_seed.sh

      - name: "Run tests for ${{ matrix.name }}"
        run: scripts/gno.sh test "${{ matrix.pkg }}" -v
